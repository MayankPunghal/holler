name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy Pillow build
      - run: python tests/test_cleanup.py
        env: { PYTHONPATH: src }
      - run: python tests/test_vocab.py
        env: { PYTHONPATH: src }
      - run: python tests/test_app.py
      - run: python tests/test_models.py
        env: { PYTHONPATH: src }
      - run: python tests/test_bench.py
      - run: python -m holler.overlay --preview /tmp/previews
        env: { PYTHONPATH: src }
      - run: python -m build
